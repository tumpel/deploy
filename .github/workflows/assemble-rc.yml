name: assemble-rc

on:
  repository_dispatch:
    types: [component-released]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Print the pin diff and the RC tag without writing them
        default: false
        type: boolean

permissions:
  actions: write
  contents: write

concurrency:
  group: assemble-rc
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install the script dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - id: assemble
        name: Assemble the release with optional candidate evidence
        run: npm run release:rc -- ${{ inputs.dry-run && '--dry-run' || '' }}
