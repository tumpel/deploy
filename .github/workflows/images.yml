name: images

on:
  push:
    tags: ["images-v*"]
  workflow_dispatch:
    inputs:
      stage:
        description: Stage whose releases bucket receives the images; run it on an images-vX.Y.Z tag
        default: dev
        type: string

permissions:
  contents: read

env:
  TUMPEL_STAGE: ${{ inputs.stage || 'dev' }}
  BUILD_ARM64: "false"

jobs:
  plan:
    runs-on: [self-hosted, tumpel-build]
    timeout-minutes: 5
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - id: matrix
        env:
          AMD64: >-
            {"arch": "amd64", "target": "x86_64-unknown-linux-gnu",
            "packages": "squashfs-tools e2fsprogs dpkg umoci build-essential pkg-config unzip"}
          ARM64: >-
            {"arch": "arm64", "target": "aarch64-unknown-linux-gnu",
            "packages": "squashfs-tools e2fsprogs dpkg umoci build-essential pkg-config unzip gcc-aarch64-linux-gnu libc6-dev-arm64-cross"}
        run: |
          if [ "$BUILD_ARM64" = true ]; then include="[$AMD64, $ARM64]"; else include="[$AMD64]"; fi
          echo "include=$include" >> "$GITHUB_OUTPUT"

  images:
    needs: plan
    runs-on: [self-hosted, tumpel-build]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    env:
      TUMPEL_IMAGE_DIR: ${{ github.workspace }}/.tmp/images-${{ matrix.arch }}
      TUMPEL_GUEST_BIN: ${{ github.workspace }}/.tmp/release-binaries/tumpel-guest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install image tools
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=600 update
          sudo apt-get -o DPkg::Lock::Timeout=600 install -y --no-install-recommends ${{ matrix.packages }}

      - name: Install npm workspaces
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Fetch the guest of the supervisor release-pins.json names
        run: npm run release:fetch -- guest

      - name: Build the guest images
        run: npm run guest:image -- all ${{ matrix.arch }}

      - name: Build the base image
        run: npm run guest:image -- base ${{ matrix.arch }}

      - name: Upload the images and kernels
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_RELEASES_ACCESS_KEY_ID: ${{ secrets.R2_RELEASES_ACCESS_KEY_ID }}
          R2_RELEASES_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASES_SECRET_ACCESS_KEY }}
        run: >-
          npm run release:publish -- images ${{ matrix.arch }}
          "$TUMPEL_IMAGE_DIR"
          ".tmp/fragments/${{ matrix.arch }}.json"

      - uses: actions/upload-artifact@v7
        with:
          name: images-${{ matrix.arch }}
          path: .tmp/fragments/${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload the base image
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_RELEASES_ACCESS_KEY_ID: ${{ secrets.R2_RELEASES_ACCESS_KEY_ID }}
          R2_RELEASES_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASES_SECRET_ACCESS_KEY }}
        run: >-
          npm run release:publish -- base ${{ matrix.arch }}
          "$TUMPEL_IMAGE_DIR/base"
          ".tmp/base-fragments/${{ matrix.arch }}.json"

      - uses: actions/upload-artifact@v7
        with:
          name: bases-${{ matrix.arch }}
          path: .tmp/base-fragments/${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Delete the build dir
        if: always()
        run: rm -rf "$TUMPEL_IMAGE_DIR"

  publish:
    needs: images
    runs-on: [self-hosted, tumpel-build]
    timeout-minutes: 10
    concurrency:
      group: image-release-${{ inputs.stage || 'dev' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install npm workspaces
        run: npm ci --prefer-offline --no-audit --no-fund

      - uses: actions/download-artifact@v8
        with:
          pattern: images-*
          path: .tmp/fragments

      - uses: actions/download-artifact@v8
        with:
          pattern: bases-*
          path: .tmp/base-fragments

      - name: Write images.json with the bases and carry the images into current.json
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_RELEASES_ACCESS_KEY_ID: ${{ secrets.R2_RELEASES_ACCESS_KEY_ID }}
          R2_RELEASES_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASES_SECRET_ACCESS_KEY }}
        run: npm run release:publish -- image-release .tmp/fragments .tmp/base-fragments
