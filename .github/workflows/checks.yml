name: checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Run the checks
        run: npm run check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: npm tests
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Run the npm-scripts tests
        run: npm test
