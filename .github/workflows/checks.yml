name: checks

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: check
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install npm workspaces
        run: npm ci --no-audit --no-fund

      - name: Run npm run check
        run: npm run check

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: control-plane 1/3
            cache: control-plane
            run: TEST_SHARD=1/3 npm test -w @tumpel/control-plane
          - name: control-plane 2/3
            cache: control-plane
            run: TEST_SHARD=2/3 npm test -w @tumpel/control-plane
          - name: control-plane 3/3
            cache: control-plane
            run: TEST_SHARD=3/3 npm test -w @tumpel/control-plane
          - name: dashboard and scripts
            cache: ""
            run: npm test -w @tumpel/dashboard && npm run test:scripts
          - name: cargo
            cache: cargo-test
            run: cargo test --workspace
    name: test (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - if: matrix.cache != ''
        uses: dtolnay/rust-toolchain@stable

      - if: matrix.cache != ''
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.cache }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install npm workspaces
        run: npm ci --no-audit --no-fund

      - name: Run the tests
        run: ${{ matrix.run }}
