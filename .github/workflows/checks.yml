name: checks

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  check:
    runs-on: [self-hosted, tumpel-build]
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-check
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: check
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install npm workspaces
        run: npm ci --no-audit --no-fund

      - name: Run npm run check
        run: npm run check

  test:
    runs-on: [self-hosted, tumpel-build]
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-test-${{ matrix.name }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: npm 1/3
            cache: npm-test
            run: TEST_SHARD=1/3 npm test
          - name: npm 2/3
            cache: npm-test
            run: TEST_SHARD=2/3 npm test
          - name: npm 3/3
            cache: npm-test
            run: TEST_SHARD=3/3 npm test
          - name: cargo
            cache: cargo-test
            run: cargo test --workspace
    name: test (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.cache }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install npm workspaces
        run: npm ci --no-audit --no-fund

      - name: Run the tests
        run: ${{ matrix.run }}
