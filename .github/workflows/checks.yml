name: checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  check:
    runs-on: [self-hosted, tumpel-build]
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-check
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install npm workspaces
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run the checks
        run: npm run check

      - if: failure()
        name: Cancel the rest of the run
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"
          "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"

  test:
    needs: check
    runs-on: [self-hosted, tumpel-build]
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-test
      cancel-in-progress: true
    name: npm tests
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install npm workspaces
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run the unit tests of every package and the npm-scripts tests
        run: npm test

      - if: failure()
        name: Cancel the rest of the run
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"
          "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"

  integration:
    runs-on: [self-hosted, tumpel-build]
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-integration
      cancel-in-progress: true
    name: integration tests
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install npm workspaces
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run the integration tests against the supervisor and CLI release-pins.json names
        run: TUMPEL_RELEASE_CACHE="$HOME/tumpel-releases" npm run test:integration -w @tumpel/control-plane

      - if: failure()
        name: Cancel the rest of the run
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"
          "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"
