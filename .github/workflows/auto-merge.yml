name: auto-merge

on:
  workflow_run:
    workflows: [checks]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Mark ready and enable squash auto-merge
        run: |
          pr=$(gh pr list --head "$HEAD_BRANCH" --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            echo "No open pull request for $HEAD_BRANCH."
            exit 0
          fi
          if gh pr view "$pr" --json labels --jq '.labels[].name' | grep -qx 'do-not-merge'; then
            echo "Pull request #$pr has the do-not-merge label."
            exit 0
          fi
          if [ "$(gh pr view "$pr" --json isDraft --jq .isDraft)" = "true" ]; then
            gh pr ready "$pr"
          fi
          gh pr merge "$pr" --auto --squash
