name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "crates/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "npm-scripts/release-publish.mjs"
      - "npm-scripts/release-architectures.mjs"
      - "packages/api/release.tsp"
      - ".github/workflows/release.yml"
      - ".github/workflows/checks.yml"
  workflow_dispatch:
    inputs:
      stage:
        description: Stage whose releases bucket receives the build
        default: dev
        type: string

permissions:
  contents: read

env:
  TUMPEL_STAGE: ${{ inputs.stage || 'dev' }}
  CARGO_TERM_COLOR: never
  BUILD_ARM64: "false"

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - id: matrix
        env:
          AMD64: '{"arch": "amd64", "target": "x86_64-unknown-linux-gnu", "packages": ""}'
          ARM64: '{"arch": "arm64", "target": "aarch64-unknown-linux-gnu", "packages": "gcc-aarch64-linux-gnu libc6-dev-arm64-cross"}'
        run: |
          if [ "$BUILD_ARM64" = true ]; then include="[$AMD64, $ARM64]"; else include="[$AMD64]"; fi
          echo "include=$include" >> "$GITHUB_OUTPUT"

  checks:
    uses: ./.github/workflows/checks.yml

  binaries:
    needs: plan
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    env:
      TUMPEL_TARGET: ${{ matrix.target }}
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.arch == 'arm64' && 'aarch64-linux-gnu-gcc' || '' }}
      CC_aarch64_unknown_linux_gnu: ${{ matrix.arch == 'arm64' && 'aarch64-linux-gnu-gcc' || '' }}
      AR_aarch64_unknown_linux_gnu: ${{ matrix.arch == 'arm64' && 'aarch64-linux-gnu-ar' || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - if: matrix.packages != ''
        name: Install the cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.packages }}

      - name: Install npm workspaces
        run: npm ci --no-audit --no-fund

      - name: Build the supervisor and the CLI
        run: npm run release:build

      - name: Upload the supervisor and the CLI
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_RELEASES_ACCESS_KEY_ID: ${{ secrets.R2_RELEASES_ACCESS_KEY_ID }}
          R2_RELEASES_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASES_SECRET_ACCESS_KEY }}
        run: >-
          npm run release:publish -- binaries ${{ matrix.arch }}
          "target/${{ matrix.target }}/release/tumpel-supervisor"
          "target/${{ matrix.target }}/release/tumpel"
          ".tmp/fragments/${{ matrix.arch }}.json"

      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.arch }}
          path: .tmp/fragments/${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [checks, binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: release-publish-${{ inputs.stage || 'dev' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install npm workspaces
        run: npm ci --no-audit --no-fund

      - uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: .tmp/fragments

      - name: Write current.json
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_RELEASES_ACCESS_KEY_ID: ${{ secrets.R2_RELEASES_ACCESS_KEY_ID }}
          R2_RELEASES_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASES_SECRET_ACCESS_KEY }}
        run: npm run release:publish -- manifest .tmp/fragments

  workflows:
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Publish the reusable workflows to tumpel/workflows
        env:
          WORKFLOWS_PUBLISH_TOKEN: ${{ secrets.WORKFLOWS_PUBLISH_TOKEN }}
        run: npm run workflows:publish
