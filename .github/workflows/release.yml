name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      stage:
        description: Stage whose releases bucket receives the release
        default: dev
        type: string

permissions:
  contents: read

env:
  TUMPEL_STAGE: ${{ inputs.stage || 'dev' }}
  BUILD_ARM64: "false"

jobs:
  plan:
    runs-on: [self-hosted, tumpel-build]
    timeout-minutes: 5
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - id: matrix
        run: |
          if [ "$BUILD_ARM64" = true ]; then include='[{"arch": "amd64"}, {"arch": "arm64"}]'; else include='[{"arch": "amd64"}]'; fi
          echo "include=$include" >> "$GITHUB_OUTPUT"

  generate:
    runs-on: [self-hosted, tumpel-build]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v4
        id: build-cache
        with:
          path: build
          key: build-typespec-${{ hashFiles('typespec/**', '!typespec/node_modules/**', 'Makefile') }}

      - if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - if: steps.build-cache.outputs.cache-hit != 'true'
        name: Generate the TypeSpec output into build/
        run: make generate-ts

      - if: steps.build-cache.outputs.cache-hit != 'true'
        name: Fail on an uncommitted rewrite of the channel wire lock
        run: git diff --exit-code typespec/channel-wire

      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: build
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  layers:
    needs: [plan, generate]
    runs-on: [self-hosted, tumpel-build]
    timeout-minutes: 20
    concurrency:
      group: release-layers-${{ github.ref }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    env:
      TUMPEL_LAYER_DIR: ${{ github.workspace }}/.tmp/layers-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install squashfs-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends squashfs-tools

      - uses: actions/download-artifact@v8
        with:
          name: build
          path: build

      - name: Mark the downloaded build/ as current
        run: touch build/.typespec

      - name: Install npm workspaces
        run: npm ci --prefer-offline --no-audit --no-fund

      - id: layers
        name: Look up the harness layers the release bucket holds
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_RELEASES_ACCESS_KEY_ID: ${{ secrets.R2_RELEASES_ACCESS_KEY_ID }}
          R2_RELEASES_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASES_SECRET_ACCESS_KEY }}
        run: |
          npm run release:publish -- layer-plan ${{ matrix.arch }} ".tmp/layer-plan-${{ matrix.arch }}.json"
          echo "missing=$(jq -r '.missing | join(" ")' ".tmp/layer-plan-${{ matrix.arch }}.json")" >> "$GITHUB_OUTPUT"

      - if: steps.layers.outputs.missing != ''
        name: Build the missing harness layers
        env:
          MISSING: ${{ steps.layers.outputs.missing }}
        run: |
          for harness in $MISSING; do
            npm run harness:layer -- "$harness" ${{ matrix.arch }}
          done

      - name: Upload the harness layers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_RELEASES_ACCESS_KEY_ID: ${{ secrets.R2_RELEASES_ACCESS_KEY_ID }}
          R2_RELEASES_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASES_SECRET_ACCESS_KEY }}
        run: >-
          npm run release:publish -- layers ${{ matrix.arch }}
          ".tmp/layer-plan-${{ matrix.arch }}.json"
          "$TUMPEL_LAYER_DIR"
          ".tmp/layer-fragments/${{ matrix.arch }}.json"

      - uses: actions/upload-artifact@v7
        with:
          name: layers-${{ matrix.arch }}
          path: .tmp/layer-fragments/${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Delete the build dir
        if: always()
        run: rm -rf "$TUMPEL_LAYER_DIR"

  publish:
    needs: [generate, layers]
    runs-on: [self-hosted, tumpel-build]
    timeout-minutes: 10
    concurrency:
      group: release-publish-${{ inputs.stage || 'dev' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - uses: actions/download-artifact@v8
        with:
          name: build
          path: build

      - name: Mark the downloaded build/ as current
        run: touch build/.typespec

      - name: Install npm workspaces
        run: npm ci --prefer-offline --no-audit --no-fund

      - uses: actions/download-artifact@v8
        with:
          pattern: layers-*
          path: .tmp/layer-fragments

      - name: Write current.json with the supervisor and CLI release-pins.json names
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_RELEASES_ACCESS_KEY_ID: ${{ secrets.R2_RELEASES_ACCESS_KEY_ID }}
          R2_RELEASES_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASES_SECRET_ACCESS_KEY }}
        run: npm run release:publish -- manifest .tmp/layer-fragments

  promote:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, tumpel-build]
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: release-promote
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Move the release branch to the tag
        run: git push origin "$GITHUB_SHA:refs/heads/release"
