name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      stage:
        description: Stage whose releases bucket receives the build
        default: dev
        type: string
      supervisor:
        description: Build and publish the supervisor even when crates/tumpel-supervisor is unchanged
        default: false
        type: boolean

permissions:
  contents: read

env:
  TUMPEL_STAGE: ${{ inputs.stage || 'dev' }}
  CARGO_TERM_COLOR: never
  BUILD_ARM64: "false"

jobs:
  plan:
    needs: generate
    runs-on: [self-hosted, tumpel-build]
    timeout-minutes: 10
    outputs:
      include: ${{ steps.matrix.outputs.include }}
      supervisor: ${{ steps.supervisor.outputs.supervisor }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - uses: actions/download-artifact@v8
        with:
          name: build
          path: build

      - name: Mark the downloaded build/ as current
        run: touch build/.typespec && touch build/.rust

      - name: Install npm workspaces
        run: npm ci --prefer-offline --no-audit --no-fund

      - id: supervisor
        name: Decide whether this run builds the supervisor
        env:
          REQUESTED: ${{ inputs.supervisor }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_RELEASES_ACCESS_KEY_ID: ${{ secrets.R2_RELEASES_ACCESS_KEY_ID }}
          R2_RELEASES_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASES_SECRET_ACCESS_KEY }}
        run: |
          if [ "$REQUESTED" = true ]; then
            echo "supervisor=true" >> "$GITHUB_OUTPUT"
          else
            npm run release:publish -- supervisor-plan "$GITHUB_OUTPUT"
          fi

      - id: matrix
        env:
          AMD64: '{"arch": "amd64", "target": "x86_64-unknown-linux-gnu", "packages": ""}'
          ARM64: '{"arch": "arm64", "target": "aarch64-unknown-linux-gnu", "packages": "gcc-aarch64-linux-gnu libc6-dev-arm64-cross"}'
        run: |
          if [ "$BUILD_ARM64" = true ]; then include="[$AMD64, $ARM64]"; else include="[$AMD64]"; fi
          echo "include=$include" >> "$GITHUB_OUTPUT"

  generate:
    runs-on: [self-hosted, tumpel-build]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v4
        id: build-cache
        with:
          path: build
          key: build-${{ hashFiles('typespec/**', '!typespec/node_modules/**', 'Makefile', 'crates/xtask/**', 'Cargo.lock') }}

      - if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - if: steps.build-cache.outputs.cache-hit != 'true'
        name: Put the runner rustup on PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - if: steps.build-cache.outputs.cache-hit != 'true'
        name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install

      - if: steps.build-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"
          key: generate

      - if: steps.build-cache.outputs.cache-hit != 'true'
        name: Generate the TypeSpec output into build/
        run: make generate

      - if: steps.build-cache.outputs.cache-hit != 'true'
        name: Fail on an uncommitted rewrite of the channel wire lock
        run: git diff --exit-code typespec/channel-wire

      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: build
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  binaries:
    needs: [plan, generate]
    runs-on: [self-hosted, tumpel-build]
    timeout-minutes: 20
    concurrency:
      group: release-binaries-${{ github.ref }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    env:
      TUMPEL_TARGET: ${{ matrix.target }}
      TUMPEL_LAYER_DIR: ${{ github.workspace }}/.tmp/layers-${{ matrix.arch }}
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.arch == 'arm64' && 'aarch64-linux-gnu-gcc' || '' }}
      CC_aarch64_unknown_linux_gnu: ${{ matrix.arch == 'arm64' && 'aarch64-linux-gnu-gcc' || '' }}
      AR_aarch64_unknown_linux_gnu: ${{ matrix.arch == 'arm64' && 'aarch64-linux-gnu-ar' || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Put the runner rustup on PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install the toolchain rust-toolchain.toml pins
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"
          shared-key: release-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install squashfs-tools and the cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends squashfs-tools ${{ matrix.packages }}

      - uses: actions/download-artifact@v8
        with:
          name: build
          path: build

      - name: Mark the downloaded build/ as current
        run: touch build/.typespec && touch build/.rust

      - name: Install npm workspaces
        run: npm ci --prefer-offline --no-audit --no-fund

      - if: needs.plan.outputs.supervisor == 'true'
        name: Build the supervisor and the CLI
        run: npm run release:build

      - if: needs.plan.outputs.supervisor == 'true'
        name: Upload the supervisor and the CLI
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_RELEASES_ACCESS_KEY_ID: ${{ secrets.R2_RELEASES_ACCESS_KEY_ID }}
          R2_RELEASES_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASES_SECRET_ACCESS_KEY }}
        run: >-
          npm run release:publish -- binaries ${{ matrix.arch }}
          "target/${{ matrix.target }}/release/tumpel-supervisor"
          "target/${{ matrix.target }}/release/tumpel"
          ".tmp/fragments/${{ matrix.arch }}.json"

      - if: needs.plan.outputs.supervisor != 'true'
        name: Build the CLI
        run: npm run release:build:cli

      - if: needs.plan.outputs.supervisor != 'true'
        name: Upload the CLI and keep the published supervisor
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_RELEASES_ACCESS_KEY_ID: ${{ secrets.R2_RELEASES_ACCESS_KEY_ID }}
          R2_RELEASES_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASES_SECRET_ACCESS_KEY }}
        run: >-
          npm run release:publish -- cli ${{ matrix.arch }}
          "target/${{ matrix.target }}/release/tumpel"
          ".tmp/fragments/${{ matrix.arch }}.json"

      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.arch }}
          path: .tmp/fragments/${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 7

      - id: layers
        name: Look up the harness layers the release bucket holds
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_RELEASES_ACCESS_KEY_ID: ${{ secrets.R2_RELEASES_ACCESS_KEY_ID }}
          R2_RELEASES_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASES_SECRET_ACCESS_KEY }}
        run: |
          npm run release:publish -- layer-plan ${{ matrix.arch }} ".tmp/layer-plan-${{ matrix.arch }}.json"
          echo "missing=$(jq -r '.missing | join(" ")' ".tmp/layer-plan-${{ matrix.arch }}.json")" >> "$GITHUB_OUTPUT"

      - if: steps.layers.outputs.missing != ''
        name: Build the missing harness layers
        env:
          MISSING: ${{ steps.layers.outputs.missing }}
        run: |
          for harness in $MISSING; do
            npm run harness:layer -- "$harness" ${{ matrix.arch }}
          done

      - name: Upload the harness layers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_RELEASES_ACCESS_KEY_ID: ${{ secrets.R2_RELEASES_ACCESS_KEY_ID }}
          R2_RELEASES_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASES_SECRET_ACCESS_KEY }}
        run: >-
          npm run release:publish -- layers ${{ matrix.arch }}
          ".tmp/layer-plan-${{ matrix.arch }}.json"
          "$TUMPEL_LAYER_DIR"
          ".tmp/layer-fragments/${{ matrix.arch }}.json"

      - uses: actions/upload-artifact@v7
        with:
          name: layers-${{ matrix.arch }}
          path: .tmp/layer-fragments/${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Delete the build dir
        if: always()
        run: rm -rf "$TUMPEL_LAYER_DIR"

  publish:
    needs: [generate, binaries]
    runs-on: [self-hosted, tumpel-build]
    timeout-minutes: 10
    concurrency:
      group: release-publish-${{ inputs.stage || 'dev' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - uses: actions/download-artifact@v8
        with:
          name: build
          path: build

      - name: Mark the downloaded build/ as current
        run: touch build/.typespec && touch build/.rust

      - name: Install npm workspaces
        run: npm ci --prefer-offline --no-audit --no-fund

      - uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: .tmp/fragments

      - uses: actions/download-artifact@v8
        with:
          pattern: layers-*
          path: .tmp/layer-fragments

      - name: Write current.json
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_RELEASES_ACCESS_KEY_ID: ${{ secrets.R2_RELEASES_ACCESS_KEY_ID }}
          R2_RELEASES_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASES_SECRET_ACCESS_KEY }}
        run: npm run release:publish -- manifest .tmp/fragments .tmp/layer-fragments

  promote:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, tumpel-build]
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: release-promote
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Move the release branch to the tag
        run: git push origin "$GITHUB_SHA:refs/heads/release"
