name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      stage:
        description: Stage whose releases bucket receives the release
        default: dev
        type: string

permissions:
  contents: read

env:
  TUMPEL_STAGE: ${{ inputs.stage || 'dev' }}
  BUILD_ARM64: "false"

jobs:
  plan:
    runs-on: [self-hosted, tumpel-build]
    timeout-minutes: 5
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - id: matrix
        run: |
          if [ "$BUILD_ARM64" = true ]; then include='[{"arch": "amd64"}, {"arch": "arm64"}]'; else include='[{"arch": "amd64"}]'; fi
          echo "include=$include" >> "$GITHUB_OUTPUT"

  layers:
    needs: plan
    runs-on: [self-hosted, tumpel-build]
    timeout-minutes: 20
    concurrency:
      group: release-layers-${{ github.ref }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    env:
      TUMPEL_LAYER_DIR: ${{ github.workspace }}/.tmp/layers-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install squashfs-tools
        run: |
          command -v mksquashfs >/dev/null && exit 0
          sudo apt-get -o DPkg::Lock::Timeout=600 update
          sudo apt-get -o DPkg::Lock::Timeout=600 install -y --no-install-recommends squashfs-tools

      - name: Install npm workspaces
        run: npm ci --prefer-offline --no-audit --no-fund

      - id: layers
        name: Look up the harness layers the release bucket holds
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_RELEASES_ACCESS_KEY_ID: ${{ secrets.R2_RELEASES_ACCESS_KEY_ID }}
          R2_RELEASES_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASES_SECRET_ACCESS_KEY }}
        run: |
          npm run release:publish -- layer-plan ${{ matrix.arch }} ".tmp/layer-plan-${{ matrix.arch }}.json"
          echo "missing=$(jq -r '.missing | join(" ")' ".tmp/layer-plan-${{ matrix.arch }}.json")" >> "$GITHUB_OUTPUT"

      - if: steps.layers.outputs.missing != ''
        name: Build the missing harness layers
        env:
          MISSING: ${{ steps.layers.outputs.missing }}
        run: |
          for harness in $MISSING; do
            npm run harness:layer -- "$harness" ${{ matrix.arch }}
          done

      - name: Upload the harness layers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_RELEASES_ACCESS_KEY_ID: ${{ secrets.R2_RELEASES_ACCESS_KEY_ID }}
          R2_RELEASES_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASES_SECRET_ACCESS_KEY }}
        run: >-
          npm run release:publish -- layers ${{ matrix.arch }}
          ".tmp/layer-plan-${{ matrix.arch }}.json"
          "$TUMPEL_LAYER_DIR"
          ".tmp/layer-fragments/${{ matrix.arch }}.json"

      - uses: actions/upload-artifact@v7
        with:
          name: layers-${{ matrix.arch }}
          path: .tmp/layer-fragments/${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Delete the build dir
        if: always()
        run: rm -rf "$TUMPEL_LAYER_DIR"

  publish:
    needs: layers
    runs-on: [self-hosted, tumpel-build]
    timeout-minutes: 10
    concurrency:
      group: release-publish-${{ inputs.stage || 'dev' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install npm workspaces
        run: npm ci --prefer-offline --no-audit --no-fund

      - uses: actions/download-artifact@v8
        with:
          pattern: layers-*
          path: .tmp/layer-fragments

      - name: Write current.json with the supervisor and CLI release-pins.json names
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_RELEASES_ACCESS_KEY_ID: ${{ secrets.R2_RELEASES_ACCESS_KEY_ID }}
          R2_RELEASES_SECRET_ACCESS_KEY: ${{ secrets.R2_RELEASES_SECRET_ACCESS_KEY }}
        run: npm run release:publish -- manifest .tmp/layer-fragments

  promote:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, tumpel-build]
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: release-promote
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Move the release branch to the tag
        run: git push origin "$GITHUB_SHA:refs/heads/release"

  deploy:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, tumpel-build]
    timeout-minutes: 15
    concurrency:
      group: release-deploy-${{ inputs.stage || 'dev' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - id: pin
        name: Read the control plane pin
        run: echo "ref=$(jq -er .controlPlane release-pins.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: tumpel/control-plane
          ref: ${{ steps.pin.outputs.ref }}
          path: .tmp/control-plane

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install the control plane's npm workspaces
        working-directory: .tmp/control-plane
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Read the stage's infra outputs and set its D1 database id
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TOFU_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          outputs="$RUNNER_TEMP/infra-outputs.json"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o "$outputs" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/tumpel-builder-secrets/objects/infra-outputs-$TUMPEL_STAGE.json"
          database_id=$(jq -er --arg stage "$TUMPEL_STAGE" '.[$stage].d1DatabaseId' deploy/control-plane/stages.json)
          if [ "$(jq -r .d1_database_id "$outputs")" != "$database_id" ]; then
            echo "The infra of $TUMPEL_STAGE names another D1 database than deploy/control-plane/stages.json."
            exit 1
          fi
          sed -i "s/00000000-0000-0000-0000-000000000000/$database_id/" .tmp/control-plane/packages/control-plane/wrangler.jsonc
          for key in hostname dashboard_hostname issuer_hostname access_issuer access_aud proof_common_name; do
            value=$(jq -er ".$key" "$outputs")
            echo "INFRA_${key^^}=$value" >> "$GITHUB_ENV"
          done

      - name: Deploy the dashboard, apply the D1 migrations and deploy the control plane
        working-directory: .tmp/control-plane/packages/control-plane
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TOFU_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          (cd ../dashboard-site && npx wrangler deploy --env "$TUMPEL_STAGE" --var "API_ORIGIN:https://$INFRA_HOSTNAME")
          npx wrangler d1 migrations apply DB --remote --env "$TUMPEL_STAGE"
          redirects="[\"https://$INFRA_DASHBOARD_HOSTNAME/auth/callback\"]"
          npx wrangler d1 execute DB --remote --yes --env "$TUMPEL_STAGE" --command "INSERT INTO oauth_clients (client_id, client_name, redirect_uris, created_at, first_party) VALUES ('tumpel-dashboard', 'the tumpel dashboard', '$redirects', $(date +%s%3N), 1) ON CONFLICT (client_id) DO UPDATE SET client_name = excluded.client_name, redirect_uris = excluded.redirect_uris, first_party = 1"
          npx wrangler deploy --env "$TUMPEL_STAGE" \
            --var "ACCESS_ISSUER:$INFRA_ACCESS_ISSUER" \
            --var "ACCESS_AUD:$INFRA_ACCESS_AUD" \
            --var "ACCESS_PROOF_COMMON_NAME:$INFRA_PROOF_COMMON_NAME" \
            --var "ISSUER_HOSTNAME:$INFRA_ISSUER_HOSTNAME" \
            --var "DASHBOARD_ORIGIN:https://$INFRA_DASHBOARD_HOSTNAME" \
            --var "API_ORIGIN:https://$INFRA_HOSTNAME" \
            --var "DEPLOYED_COMMIT:$(git rev-parse HEAD)"
