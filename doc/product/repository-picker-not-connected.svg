<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
<title>Repository picker: GitHub not connected</title>
<rect x="0" y="0" width="800" height="800" fill="#ffffff"/>
<text x="20" y="32" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#222222" text-anchor="start">Repository picker: GitHub not connected</text>
<rect x="20" y="52" width="360" height="720" rx="28" fill="#ffffff" stroke="#555555" stroke-width="2"/><rect x="160" y="62" width="80" height="8" rx="4" fill="#dddddd" stroke="#dddddd" stroke-width="1"/>
<text x="36" y="104" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#222222" text-anchor="start">Build a prebuild</text><text x="360" y="104" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#222222" text-anchor="end">X</text><text x="36" y="130" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#555555" text-anchor="start">Tumpel reads the devcontainer files and</text><text x="36" y="146" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#555555" text-anchor="start">lockfiles on the default branch.</text><text x="36" y="180" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#222222" text-anchor="start">Repository</text><rect x="36" y="190" width="328" height="44" rx="4" fill="#eeeeee" stroke="#555555" stroke-width="1" stroke-dasharray="4 3"/><text x="48" y="217" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#888888" text-anchor="start">Pick a repository</text><polyline points="337,209 342,214 347,209" fill="none" stroke="#555555" stroke-width="1.5"/><rect x="36" y="246" width="328" height="128" rx="4" fill="#ffffff" stroke="#555555" stroke-width="2"/><text x="48" y="272" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">Connect GitHub to pick a repository</text><text x="48" y="294" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#555555" text-anchor="start">Install the GitHub App on an account</text><text x="48" y="310" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#555555" text-anchor="start">or org. You come back to this dialog.</text><rect x="48" y="322" width="160" height="40" rx="4" fill="#444444" stroke="#444444" stroke-width="1"/><text x="128" y="347" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Connect GitHub</text><text x="36" y="410" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#222222" text-anchor="start">Provider</text><rect x="36" y="420" width="328" height="44" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1"/><text x="48" y="447" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">Provider name</text><polyline points="337,439 342,444 347,439" fill="none" stroke="#555555" stroke-width="1.5"/><text x="36" y="494" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#222222" text-anchor="start">Persona</text><rect x="36" y="504" width="328" height="44" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1"/><text x="48" y="531" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">Persona name</text><polyline points="337,523 342,528 347,523" fill="none" stroke="#555555" stroke-width="1.5"/><rect x="36" y="690" width="160" height="44" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1"/><text x="116" y="717" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#222222" text-anchor="middle">Cancel</text><rect x="204" y="690" width="160" height="44" rx="4" fill="#e6e6e6" stroke="#bbbbbb" stroke-width="1"/><text x="284" y="717" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#888888" text-anchor="middle">Build now</text><circle cx="394" cy="262" r="10" fill="#222222"/><text x="394" y="266" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><circle cx="228" cy="342" r="10" fill="#222222"/><text x="228" y="346" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<text x="430" y="68" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">Notes</text>
<circle cx="430" cy="96" r="10" fill="#222222"/><text x="430" y="100" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><text x="450" y="100" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">From the GitHubNotConnected refusal.</text><text x="450" y="118" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">A Member reads Ask an Owner to connect</text><text x="450" y="136" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">GitHub, which links to Members.</text><circle cx="430" cy="172" r="10" fill="#222222"/><text x="430" y="176" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><text x="450" y="176" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">Opens Connections. Its Connect sends</text><text x="450" y="194" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">the browser to GitHub and back (S2.3).</text>
</svg>
