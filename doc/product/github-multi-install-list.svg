zation · owner · 12 repositories</text><rect x="255" y="228" width="79" height="22" rx="11" fill="#e6e6e6" stroke="#999" stroke-width="1"/><text x="294.5" y="243" font-size="11" font-weight="400" fill="#222" text-anchor="middle">Installed</text><rect x="16" y="288" width="328" height="64" rx="4" fill="#fff" stroke="#aaa" stroke-width="1"/><circle cx="38" cy="312" r="12" fill="#ddd" stroke="#999"/><text x="58" y="310" font-size="13" font-weight="700" fill="#222">org-beta</text><text x="58" y="328" font-size="11" font-weight="400" fill="#666">Organization · owner</text><rect x="258" y="296" width="76" height="32" rx="4" fill="#fff" stroke="#333" stroke-width="1"/><text x="296" y="317" font-size="13" font-weight="400" fill="#222" text-anchor="middle">Install</text><rect x="16" y="360" width="328" height="76" rx="4" fill="#fff" stroke="#aaa" stroke-width="1"/><circle cx="38" cy="384" r="12" fill="#ddd" stroke="#999"/><text x="58" y="382" font-size="13" font-weight="700" fill="#222">org-gamma</text><text x="58" y="400" font-size="11" font-weight="400" fill="#666">Organization · member</text><text x="58" y="416" font-size="11" font-weight="400" fill="#444" font-style="italic">An owner of org-gamma approves on GitHub.</text><rect x="252" y="368" width="82" height="32" rx="4" fill="#fff" stroke="#333" stroke-width="1"/><text x="293" y="389" font-size="13" font-weight="400" fill="#222" text-anchor="middle">Request</text><text x="16" y="477" font-size="12" fill="#222" text-decoration="underline">Refresh from GitHub</text><rect x="248" y="456" width="96" height="32" rx="4" fill="#333" stroke="#333" stroke-width="1"/><text x="296" y="477" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Done</text>
