<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
<title>Repository picker: loading</title>
<rect x="0" y="0" width="800" height="800" fill="#ffffff"/>
<text x="20" y="32" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#222222" text-anchor="start">Repository picker: loading</text>
<rect x="20" y="52" width="360" height="720" rx="28" fill="#ffffff" stroke="#555555" stroke-width="2"/><rect x="160" y="62" width="80" height="8" rx="4" fill="#dddddd" stroke="#dddddd" stroke-width="1"/>
<rect x="32" y="76" width="44" height="44" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1"/><line x1="47" y1="91" x2="61" y2="105" stroke="#555555" stroke-width="1.5"/><line x1="61" y1="91" x2="47" y2="105" stroke="#555555" stroke-width="1.5"/><text x="90" y="104" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#222222" text-anchor="start">Repository</text><rect x="36" y="130" width="328" height="44" rx="4" fill="#ffffff" stroke="#555555" stroke-width="2.5"/><circle cx="54" cy="150" r="6" fill="none" stroke="#777777" stroke-width="1.5"/><line x1="58" y1="154" x2="63" y2="159" stroke="#777777" stroke-width="1.5"/><text x="72" y="157" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#888888" text-anchor="start">Search owner/name</text><rect x="44" y="196" width="312" height="40" rx="4" fill="#eeeeee" stroke="#eeeeee" stroke-width="1"/><rect x="44" y="256" width="312" height="40" rx="4" fill="#eeeeee" stroke="#eeeeee" stroke-width="1"/><rect x="44" y="316" width="312" height="40" rx="4" fill="#eeeeee" stroke="#eeeeee" stroke-width="1"/><rect x="44" y="376" width="312" height="40" rx="4" fill="#eeeeee" stroke="#eeeeee" stroke-width="1"/><text x="44" y="444" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#777777" text-anchor="start">Loading the repositories your GitHub</text><text x="44" y="460" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#777777" text-anchor="start">connections cover</text><rect x="28" y="548" width="344" height="212" rx="0" fill="#e6e6e6" stroke="#bbbbbb" stroke-width="1"/><text x="200" y="660" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#777777" text-anchor="middle">On-screen keyboard</text><circle cx="394" cy="152" r="10" fill="#222222"/><text x="394" y="156" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><circle cx="394" cy="216" r="10" fill="#222222"/><text x="394" y="220" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<text x="430" y="68" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">Notes</text>
<circle cx="430" cy="96" r="10" fill="#222222"/><text x="430" y="100" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><text x="450" y="100" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">Search takes typing at once, the</text><text x="450" y="118" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">list filters when it arrives.</text><circle cx="430" cy="154" r="10" fill="#222222"/><text x="430" y="158" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><text x="450" y="158" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">Four skeleton rows, aria-busy.</text><text x="450" y="176" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">No timer, no spinner text change.</text>
