<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
<title>Repository picker: listing refused</title>
<rect x="0" y="0" width="800" height="800" fill="#ffffff"/>
<text x="20" y="32" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#222222" text-anchor="start">Repository picker: listing refused</text>
<rect x="20" y="52" width="360" height="720" rx="28" fill="#ffffff" stroke="#555555" stroke-width="2"/><rect x="160" y="62" width="80" height="8" rx="4" fill="#dddddd" stroke="#dddddd" stroke-width="1"/>
<rect x="32" y="76" width="44" height="44" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1"/><line x1="47" y1="91" x2="61" y2="105" stroke="#555555" stroke-width="1.5"/><line x1="61" y1="91" x2="47" y2="105" stroke="#555555" stroke-width="1.5"/><text x="90" y="104" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#222222" text-anchor="start">Repository</text><rect x="36" y="130" width="328" height="44" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1"/><circle cx="54" cy="150" r="6" fill="none" stroke="#777777" stroke-width="1.5"/><line x1="58" y1="154" x2="63" y2="159" stroke="#777777" stroke-width="1.5"/><text x="72" y="157" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#888888" text-anchor="start">Search owner/name</text><rect x="36" y="190" width="328" height="236" rx="4" fill="#ffffff" stroke="#555555" stroke-width="2.5"/><text x="52" y="220" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">(!)</text><text x="80" y="220" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">GitHub refused the repository list</text><text x="80" y="244" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#222222" text-anchor="start">Problem detail: which installation</text><text x="80" y="260" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#222222" text-anchor="start">GitHub refused, and why.</text><text x="80" y="284" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#555555" text-anchor="start">Problem fix: open Connections and</text><text x="80" y="300" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#555555" text-anchor="start">reconnect or remove that account.</text><rect x="80" y="318" width="88" height="40" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1"/><text x="124" y="343" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Retry</text><rect x="176" y="318" width="160" height="40" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1"/><text x="256" y="343" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Open Connections</text><text x="80" y="392" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#222222" text-anchor="start">Report an issue</text><line x1="80" y1="396" x2="182" y2="396" stroke="#555555" stroke-width="1"/><circle cx="394" cy="216" r="10" fill="#222222"/><text x="394" y="220" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><circle cx="62" cy="338" r="10" fill="#222222"/><text x="62" y="342" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><circle cx="200" cy="388" r="10" fill="#222222"/><text x="200" y="392" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text><circle cx="394" cy="98" r="10" fill="#222222"/><text x="394" y="102" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
<text x="430" y="68" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">Notes</text>
<circle cx="430" cy="96" r="10" fill="#222222"/><text x="430" y="100" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><text x="450" y="100" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">role=alert. Title, detail and fix come</text><text x="450" y="118" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">from the Problem (RepositoryUnreadable,</text><text x="450" y="136" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">403 Forbidden, or no answer).</text><circle cx="430" cy="172" r="10" fill="#222222"/><text x="430" y="176" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><text x="450" y="176" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">Focus lands on Retry. Retry reads</text><text x="450" y="194" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">GitHubConnections_listRepositories again.</text><circle cx="430" cy="230" r="10" fill="#222222"/><text x="430" y="234" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text><text x="450" y="234" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">Prefilled issue: title, detail, path,</text><text x="450" y="252" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">time. Opens in a new tab.</text><circle cx="430" cy="288" r="10" fill="#222222"/><text x="430" y="292" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text><text x="450" y="292" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">The Repository field keeps the error</text><text x="450" y="310" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">text after close, so Build now explains</text><text x="450" y="328" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">why it stays off. A 401 signs the app out.</text>
</svg>
