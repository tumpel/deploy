<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
<title>Repository picker: results, wide screen (640 px and up)</title>
<rect x="0" y="0" width="800" height="800" fill="#ffffff"/>
<text x="20" y="32" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#222222" text-anchor="start">Repository picker: results, wide screen (640 px and up)</text>
<rect x="20" y="52" width="520" height="700" rx="8" fill="#ffffff" stroke="#555555" stroke-width="2"/>
<text x="44" y="92" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#222222" text-anchor="start">Build a prebuild</text>
<text x="44" y="116" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#555555" text-anchor="start">Tumpel reads the devcontainer files and lockfiles on the default branch.</text>
<text x="44" y="150" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#222222" text-anchor="start">Repository</text>
<rect x="44" y="160" width="472" height="36" rx="4" fill="#ffffff" stroke="#555555" stroke-width="2.5"/>
<text x="56" y="183" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#888888" text-anchor="start">Pick a repository</text>
<polyline points="493,175 498,180 503,175" fill="none" stroke="#555555" stroke-width="1.5"/>
<rect x="44" y="202" width="472" height="360" rx="6" fill="#ffffff" stroke="#555555" stroke-width="1.5"/>
<rect x="52" y="210" width="456" height="36" rx="4" fill="#ffffff" stroke="#555555" stroke-width="2.5"/>
<circle cx="68" cy="228" r="6" fill="none" stroke="#777777" stroke-width="1.5"/><line x1="72" y1="232" x2="77" y2="237" stroke="#777777" stroke-width="1.5"/>
<text x="84" y="233" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#888888" text-anchor="start">Search owner/name</text>
<rect x="52" y="254" width="456" height="22" rx="0" fill="#f0f0f0" stroke="#f0f0f0" stroke-width="1"/>
<text x="60" y="270" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#555555" text-anchor="start">owner-one  (3)</text>
<rect x="52" y="276" width="456" height="36" rx="4" fill="#d9d9d9" stroke="#d9d9d9" stroke-width="1"/>
<text x="60" y="299" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">owner-one/app-name</text>
<text x="500" y="299" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#777777" text-anchor="end">main</text>
<text x="60" y="335" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">owner-one/service-name</text>
<rect x="420" y="321" width="52" height="18" rx="9" fill="#eeeeee" stroke="#555555" stroke-width="1"/>
<text x="446" y="334" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#222222" text-anchor="middle">Private</text>
<text x="500" y="335" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#777777" text-anchor="end">main</text>
<text x="60" y="371" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">owner-one/tool-name</text>
<text x="500" y="371" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#777777" text-anchor="end">trunk</text>
<rect x="52" y="386" width="456" height="22" rx="0" fill="#f0f0f0" stroke="#f0f0f0" stroke-width="1"/>
<text x="60" y="402" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#555555" text-anchor="start">org-two  (2)</text>
<text x="60" y="431" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">org-two/api-name</text>
<rect x="420" y="417" width="52" height="18" rx="9" fill="#eeeeee" stroke="#555555" stroke-width="1"/>
<text x="446" y="430" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#222222" text-anchor="middle">Private</text>
<text x="500" y="431" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#777777" text-anchor="end">main</text>
<text x="60" y="467" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">org-two/web-name</text>
<text x="500" y="467" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#777777" text-anchor="end">main</text>
<line x1="52" y1="486" x2="508" y2="486" stroke="#dddddd" stroke-width="1"/>
<text x="60" y="512" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#222222" text-anchor="start">+ Connect another account or org</text>
<text x="60" y="540" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#777777" text-anchor="start">Up/Down move, Enter picks, Esc closes</text>
<text x="44" y="600" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#222222" text-anchor="start">Provider</text>
<rect x="44" y="610" width="472" height="36" rx="4" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1"/>
<text x="44" y="676" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#222222" text-anchor="start">Persona</text>
<rect x="44" y="686" width="472" height="36" rx="4" fill="#f7f7f7" stroke="#bbbbbb" stroke-width="1"/>
<circle cx="530" cy="178" r="10" fill="#222222"/><text x="530" y="182" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<circle cx="530" cy="228" r="10" fill="#222222"/><text x="530" y="232" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<circle cx="530" cy="512" r="10" fill="#222222"/><text x="530" y="516" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<text x="570" y="68" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">Notes</text>
<circle cx="580" cy="96" r="10" fill="#222222"/><text x="580" y="100" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<text x="598" y="100" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">Trigger: a button. The</text>
<text x="598" y="118" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">search field is the combobox.</text>
<circle cx="580" cy="150" r="10" fill="#222222"/><text x="580" y="154" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<text x="598" y="154" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">Popover under the field,</text>
<text x="598" y="172" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">trigger width, list caps</text>
<text x="598" y="190" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">at 8 rows and scrolls.</text>
<circle cx="580" cy="222" r="10" fill="#222222"/><text x="580" y="226" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<text x="598" y="226" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">Same last row as phone.</text>
<circle cx="580" cy="258" r="10" fill="#222222"/><text x="580" y="262" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
<text x="598" y="262" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">Click outside closes;</text>
<text x="598" y="280" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">the field keeps its value.</text>
</svg>
