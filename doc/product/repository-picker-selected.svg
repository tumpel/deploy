<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
<title>Repository picker: selection made</title>
<rect x="0" y="0" width="800" height="800" fill="#ffffff"/>
<text x="20" y="32" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#222222" text-anchor="start">Repository picker: selection made</text>
<rect x="20" y="52" width="360" height="720" rx="28" fill="#ffffff" stroke="#555555" stroke-width="2"/><rect x="160" y="62" width="80" height="8" rx="4" fill="#dddddd" stroke="#dddddd" stroke-width="1"/>
<text x="36" y="104" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#222222" text-anchor="start">Build a prebuild</text><text x="360" y="104" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" fill="#222222" text-anchor="end">X</text><text x="36" y="130" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#555555" text-anchor="start">Tumpel reads the devcontainer files and</text><text x="36" y="146" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#555555" text-anchor="start">lockfiles on the default branch.</text><text x="36" y="180" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#222222" text-anchor="start">Repository</text><rect x="36" y="190" width="328" height="44" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1"/><text x="48" y="217" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">org-two/api-name</text><polyline points="337,209 342,214 347,209" fill="none" stroke="#555555" stroke-width="1.5"/><text x="36" y="254" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#555555" text-anchor="start">Default branch: main. Private.</text><text x="36" y="290" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#222222" text-anchor="start">Provider</text><rect x="36" y="300" width="328" height="44" rx="4" fill="#ffffff" stroke="#555555" stroke-width="2.5"/><text x="48" y="327" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">Provider name</text><polyline points="337,319 342,324 347,319" fill="none" stroke="#555555" stroke-width="1.5"/><text x="36" y="374" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#222222" text-anchor="start">Persona</text><rect x="36" y="384" width="328" height="44" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1"/><text x="48" y="411" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">Persona name</text><polyline points="337,403 342,408 347,403" fill="none" stroke="#555555" stroke-width="1.5"/><rect x="36" y="690" width="160" height="44" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1"/><text x="116" y="717" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#222222" text-anchor="middle">Cancel</text><rect x="204" y="690" width="160" height="44" rx="4" fill="#444444" stroke="#444444" stroke-width="1"/><text x="284" y="717" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Build now</text><circle cx="394" cy="212" r="10" fill="#222222"/><text x="394" y="216" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><circle cx="394" cy="322" r="10" fill="#222222"/><text x="394" y="326" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<text x="430" y="68" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">Notes</text>
<circle cx="430" cy="96" r="10" fill="#222222"/><text x="430" y="100" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><text x="450" y="100" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">Shows owner/name. Tap or Enter on the</text><text x="450" y="118" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">field reopens the picker, text empty.</text><circle cx="430" cy="154" r="10" fill="#222222"/><text x="430" y="158" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><text x="450" y="158" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">Focus moves to the next field after</text><text x="450" y="176" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">a pick. Build now turns on.</text>
</svg>
