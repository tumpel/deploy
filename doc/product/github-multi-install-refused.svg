<rect x="0" y="0" width="360" height="56" rx="0" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/><text x="16" y="24" font-size="14" font-weight="700" fill="#222">Tumpel setup</text><text x="344" y="24" font-size="11" font-weight="400" fill="#666" text-anchor="end">tenant-name</text><circle cx="22" cy="42" r="6" fill="#555" stroke="#555" stroke-width="1"/><circle cx="44" cy="42" r="6" fill="#fff" stroke="#555" stroke-width="3"/><circle cx="66" cy="42" r="6" fill="#fff" stroke="#555" stroke-width="1"/><circle cx="88" cy="42" r="6" fill="#fff" stroke="#555" stroke-width="1"/><circle cx="110" cy="42" r="6" fill="#fff" stroke="#555" stroke-width="1"/><circle cx="132" cy="42" r="6" fill="#fff" stroke="#555" stroke-width="1"/><text x="156" y="46" font-size="11" font-weight="700" fill="#222">Step 2 of 6: GitHub</text><text x="16" y="90" font-size="17" font-weight="700" fill="#222">Connect GitHub</text><text x="16" y="112" font-size="13" font-weight="400" fill="#444">Install Tumpel on each account it may work in.</text><text x="16" y="129" font-size="13" font-weight="400" fill="#444">GitHub brings you back here after each one.</text><rect x="16" y="144" width="328" height="124" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><rect x="16" y="144" width="6" height="124" rx="0" fill="#333" stroke="none" stroke-width="1"/><text x="30" y="166" font-size="13" font-weight="700" fill="#222">Tumpel did not link org-gamma</text><text x="332" y="166" font-size="13" font-weight="400" fill="#666" text-anchor="end">x</text><text x="30" y="186" font-size="12" font-weight="400" fill="#333">Your GitHub account is a member of org-gamma.</text><text x="30" y="202" font-size="12" font-weight="400" fill="#333">Only an owner of org-gamma links it.</text><text x="30" y="218" font-size="12" font-weight="400" fill="#333">Ask an owner to install Tumpel, then refresh.</text><text x="30" y="250" font-size="12" fill="#222" text-decoration="underline">Report an issue</text><rect x="16" y="280" width="328" height="64" rx="4" fill="#fff" stroke="#aaa" stroke-width="1"/><circle cx="38" cy="304" r="12" fill="#ddd" stroke="#999"/><text x="58" y="302" font-size="13" font-weight="700" fill="#222">your-login</text><text x="58" y="320" font-size="11" font-weight="400" fill="#666">Personal account · 4 repositories</text><rect x="255" y="292" width="79" height="22" rx="11" fill="#e6e6e6" stroke="#999" stroke-width="1"/><text x="294.5" y="307" font-size="11" font-weight="400" fill="#222" text-anchor="middle">Installed</text><rect x="16" y="352" width="328" height="64" rx="4" fill="#fff" stroke="#aaa" stroke-width="1"/><circle cx="38" cy="376" r="12" fill="#ddd" stroke="#999"/><text x="58" y="374" font-size="13" font-weight="700" fill="#222">org-alpha</text><text x="58" y="392" font-size="11" font-weight="400" fill="#666">Organization · owner · 12 repositories</text><rect x="255" y="364" width="79" height="22" rx="11" fill="#e6e6e6" stroke="#999" stroke-width="1"/><text x="294.5" y="379" font-size="11" font-weight="400" fill="#222" text-anchor="middle">Installed</text><rect x="16" y="424" width="328" height="64" rx="4" fill="#fff" stroke="#aaa" stroke-width="1"/><circle cx="38" cy="448" r="12" fill="#ddd" stroke="#999"/><text x="58" y="446" font-size="13" font-weight="700" fill="#222">org-beta</text><text x="58" y="464" font-size="11" font-weight="400" fill="#666">Organization · owner</text><rect x="258" y="432" width="76" height="32" rx="4" fill="#fff" stroke="#333" stroke-width="1"/><text x="296" y="453" font-size="13" font-weight="400" fill="#222" text-anchor="middle">Install</text><rect x="16" y="496" width="328" height="76" rx="4" fill="#fff" stroke="#aaa" stroke-width="1"/><circle cx="38" cy="520" r="12" fill="#ddd" stroke="#999"/><text x="58" y="518" font-size="13" font-weight="700" fill="#222">org-gamma</text><text x="58" y="536" font-size="11" font-weight="400" fill="#666">Organization · member</text><text x="58" y="552" font-size="11" font-weight="400" fill="#444" font-style="italic">Waiting for an owner of org-gamma.</text><rect x="255" y="508" width="79" height="22" rx="11" fill="#e6e6e6" stroke="#999" stroke-width="1"/><text x="294.5" y="523" font-size="11" font-weight="400" fill="#222" text-anchor="middle">Requested</text><text x="16" y="613" font-size="12" fill="#222" text-decoration="underline">Refresh from GitHub</text><rect x="248" y="592" width="96" height="32" rx="4" fill="#333" stroke="#333" stroke-width="1"/><text x="296" y="613" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Done</text>
