<svg xmlns="http://www.w3.org/2000/svg" width="360" height="408" viewBox="0 0 360 408" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="title">
<title id="title">No organizations: only the personal account to install on.</title>
<rect x="0.5" y="0.5" width="359" height="407" fill="#fff" stroke="#555"/>
<rect x="0" y="0" width="360" height="56" rx="0" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/><text x="16" y="24" font-size="14" font-weight="700" fill="#222">Tumpel setup</text><text x="344" y="24" font-size="11" font-weight="400" fill="#666" text-anchor="end">tenant-name</text><circle cx="22" cy="42" r="6" fill="#555" stroke="#555" stroke-width="1"/><circle cx="44" cy="42" r="6" fill="#fff" stroke="#555" stroke-width="3"/><circle cx="66" cy="42" r="6" fill="#fff" stroke="#555" stroke-width="1"/><circle cx="88" cy="42" r="6" fill="#fff" stroke="#555" stroke-width="1"/><circle cx="110" cy="42" r="6" fill="#fff" stroke="#555" stroke-width="1"/><circle cx="132" cy="42" r="6" fill="#fff" stroke="#555" stroke-width="1"/><text x="156" y="46" font-size="11" font-weight="700" fill="#222">Step 2 of 6: GitHub</text><text x="16" y="90" font-size="17" font-weight="700" fill="#222">Connect GitHub</text><text x="16" y="112" font-size="13" font-weight="400" fill="#444">Install Tumpel on each account it may work in.</text><text x="16" y="129" font-size="13" font-weight="400" fill="#444">GitHub brings you back here after each one.</text><rect x="16" y="144" width="328" height="64" rx="4" fill="#fff" stroke="#aaa" stroke-width="1"/><circle cx="38" cy="168" r="12" fill="#ddd" stroke="#999"/><text x="58" y="166" font-size="13" font-weight="700" fill="#222">your-login</text><text x="58" y="184" font-size="11" font-weight="400" fill="#666">Personal account</text><rect x="258" y="152" width="76" height="32" rx="4" fill="#fff" stroke="#333" stroke-width="1"/><text x="296" y="173" font-size="13" font-weight="400" fill="#222" text-anchor="middle">Install</text><rect x="16" y="220" width="328" height="96" rx="4" fill="#f7f7f7" stroke="#bbb" stroke-width="1" stroke-dasharray="4 3"/><text x="30" y="244" font-size="13" font-weight="700" fill="#222">No organizations</text><text x="30" y="264" font-size="12" font-weight="400" fill="#333">Your GitHub account belongs to no organization.</text><text x="30" y="280" font-size="12" font-weight="400" fill="#333">Join one on GitHub, then refresh this list.</text><text x="30" y="302" font-size="12" fill="#222" text-decoration="underline">Your organizations on GitHub</text><text x="16" y="349" font-size="12" fill="#222" text-decoration="underline">Refresh from GitHub</text><rect x="248" y="328" width="96" height="32" rx="4" fill="#eee" stroke="#bbb" stroke-width="1"/><text x="296" y="349" font-size="13" font-weight="400" fill="#999" text-anchor="middle">Done</text>
<rect x="0" y="380" width="360" height="28" rx="0" fill="#fafafa" stroke="#ccc" stroke-width="1"/><text x="16" y="398" font-size="11" font-weight="400" fill="#666" font-style="italic">No organizations: only the personal account to install on.</text>
</svg>
