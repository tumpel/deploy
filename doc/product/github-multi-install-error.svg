<rect x="0" y="0" width="360" height="56" rx="0" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/><text x="16" y="24" font-size="14" font-weight="700" fill="#222">Tumpel setup</text><text x="344" y="24" font-size="11" font-weight="400" fill="#666" text-anchor="end">tenant-name</text><circle cx="22" cy="42" r="6" fill="#555" stroke="#555" stroke-width="1"/><circle cx="44" cy="42" r="6" fill="#fff" stroke="#555" stroke-width="3"/><circle cx="66" cy="42" r="6" fill="#fff" stroke="#555" stroke-width="1"/><circle cx="88" cy="42" r="6" fill="#fff" stroke="#555" stroke-width="1"/><circle cx="110" cy="42" r="6" fill="#fff" stroke="#555" stroke-width="1"/><circle cx="132" cy="42" r="6" fill="#fff" stroke="#555" stroke-width="1"/><text x="156" y="46" font-size="11" font-weight="700" fill="#222">Step 2 of 6: GitHub</text><text x="16" y="90" font-size="17" font-weight="700" fill="#222">Connect GitHub</text><text x="16" y="112" font-size="13" font-weight="400" fill="#444">Install Tumpel on each account it may work in.</text><text x="16" y="129" font-size="13" font-weight="400" fill="#444">GitHub brings you back here after each one.</text><rect x="16" y="144" width="328" height="124" rx="4" fill="#fff" stroke="#333" stroke-width="2"/><rect x="16" y="144" width="6" height="124" rx="0" fill="#333" stroke="none" stroke-width="1"/><text x="30" y="166" font-size="13" font-weight="700" fill="#222">GitHub did not list your accounts</text><text x="332" y="166" font-size="13" font-weight="400" fill="#666" text-anchor="end">x</text><text x="30" y="186" font-size="12" font-weight="400" fill="#333">GitHub answered GET /user/installations</text><text x="30" y="202" font-size="12" font-weight="400" fill="#333">with 502: Server Error.</text><text x="30" y="218" font-size="12" font-weight="400" fill="#333">Try again. Report it when it repeats.</text><rect x="30" y="230" width="96" height="32" rx="4" fill="#fff" stroke="#333" stroke-width="3"/><text x="78" y="251" font-size="13" font-weight="400" fill="#222" text-anchor="middle">Try again</text><text x="138" y="250" font-size="12" fill="#222" text-decoration="underline">Report an issue</text><text x="16" y="305" font-size="12" fill="#999" text-decoration="underline">Refresh from GitHub</text><rect x="248" y="284" width="96" height="32" rx="4" fill="#eee" stroke="#bbb" stroke-width="1"/><text x="296" y="305" font-size="13" font-weight="400" fill="#999" text-anchor="middle">Done</text>
