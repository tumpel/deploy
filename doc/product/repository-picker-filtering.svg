<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
<title>Repository picker: filtering with matches</title>
<rect x="0" y="0" width="800" height="800" fill="#ffffff"/>
<text x="20" y="32" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#222222" text-anchor="start">Repository picker: filtering with matches</text>
<rect x="20" y="52" width="360" height="720" rx="28" fill="#ffffff" stroke="#555555" stroke-width="2"/><rect x="160" y="62" width="80" height="8" rx="4" fill="#dddddd" stroke="#dddddd" stroke-width="1"/>
<rect x="32" y="76" width="44" height="44" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1"/><line x1="47" y1="91" x2="61" y2="105" stroke="#555555" stroke-width="1.5"/><line x1="61" y1="91" x2="47" y2="105" stroke="#555555" stroke-width="1.5"/><text x="90" y="104" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#222222" text-anchor="start">Repository</text><rect x="36" y="130" width="328" height="44" rx="4" fill="#ffffff" stroke="#555555" stroke-width="2.5"/><circle cx="54" cy="150" r="6" fill="none" stroke="#777777" stroke-width="1.5"/><line x1="58" y1="154" x2="63" y2="159" stroke="#777777" stroke-width="1.5"/><text x="72" y="157" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#222222" text-anchor="start">api|</text><rect x="32" y="186" width="336" height="26" rx="0" fill="#f0f0f0" stroke="#f0f0f0" stroke-width="1"/><text x="44" y="204" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#555555" text-anchor="start">owner-one  (1)</text><rect x="32" y="212" width="336" height="52" rx="0" fill="#d9d9d9" stroke="#dddddd" stroke-width="1"/><text x="44" y="234" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">owner-one/api-gateway</text><line x1="117" y1="238" x2="138.89999999999998" y2="238" stroke="#222222" stroke-width="2"/><text x="44" y="253" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#777777" text-anchor="start">main</text><rect x="32" y="264" width="336" height="26" rx="0" fill="#f0f0f0" stroke="#f0f0f0" stroke-width="1"/><text x="44" y="282" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#555555" text-anchor="start">org-two  (1)</text><rect x="32" y="290" width="336" height="52" rx="0" fill="#ffffff" stroke="#dddddd" stroke-width="1"/><text x="44" y="312" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">org-two/api-name</text><line x1="102.4" y1="316" x2="124.3" y2="316" stroke="#222222" stroke-width="2"/><text x="44" y="331" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#777777" text-anchor="start">main</text><rect x="298" y="306" width="58" height="20" rx="10" fill="#eeeeee" stroke="#555555" stroke-width="1"/><text x="327" y="320" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#222222" text-anchor="middle">Private</text><rect x="32" y="342" width="336" height="48" rx="0" fill="#ffffff" stroke="#dddddd" stroke-width="1"/><text x="44" y="371" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">+ Connect another account or org</text><text x="356" y="371" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#222222" text-anchor="end">&gt;</text><text x="44" y="410" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#777777" text-anchor="start">2 of 5 repositories</text><rect x="28" y="548" width="344" height="212" rx="0" fill="#e6e6e6" stroke="#bbbbbb" stroke-width="1"/><text x="200" y="660" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#777777" text-anchor="middle">On-screen keyboard</text><circle cx="394" cy="152" r="10" fill="#222222"/><text x="394" y="156" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><circle cx="276" cy="238" r="10" fill="#222222"/><text x="276" y="242" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><circle cx="202" cy="405" r="10" fill="#222222"/><text x="202" y="409" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<text x="430" y="68" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">Notes</text>
<circle cx="430" cy="96" r="10" fill="#222222"/><text x="430" y="100" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><text x="450" y="100" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">Case-insensitive match on owner/name.</text><text x="450" y="118" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">A pasted github.com URL matches too.</text><circle cx="430" cy="154" r="10" fill="#222222"/><text x="430" y="158" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><text x="450" y="158" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">The first match is active, so Enter</text><text x="450" y="176" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">picks it. Matched text is underlined.</text><circle cx="430" cy="212" r="10" fill="#222222"/><text x="430" y="216" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text><text x="450" y="216" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">A polite live region reads the count.</text>
</svg>
