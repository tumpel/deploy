<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
<title>Repository picker: results</title>
<rect x="0" y="0" width="800" height="800" fill="#ffffff"/>
<text x="20" y="32" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#222222" text-anchor="start">Repository picker: results</text>
<rect x="20" y="52" width="360" height="720" rx="28" fill="#ffffff" stroke="#555555" stroke-width="2"/><rect x="160" y="62" width="80" height="8" rx="4" fill="#dddddd" stroke="#dddddd" stroke-width="1"/>
<rect x="32" y="76" width="44" height="44" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1"/><line x1="47" y1="91" x2="61" y2="105" stroke="#555555" stroke-width="1.5"/><line x1="61" y1="91" x2="47" y2="105" stroke="#555555" stroke-width="1.5"/><text x="90" y="104" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#222222" text-anchor="start">Repository</text><rect x="36" y="130" width="328" height="44" rx="4" fill="#ffffff" stroke="#555555" stroke-width="2.5"/><circle cx="54" cy="150" r="6" fill="none" stroke="#777777" stroke-width="1.5"/><line x1="58" y1="154" x2="63" y2="159" stroke="#777777" stroke-width="1.5"/><text x="72" y="157" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#888888" text-anchor="start">Search owner/name</text><rect x="32" y="186" width="336" height="26" rx="0" fill="#f0f0f0" stroke="#f0f0f0" stroke-width="1"/><text x="44" y="204" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#555555" text-anchor="start">owner-one  (3)</text><rect x="32" y="212" width="336" height="52" rx="0" fill="#d9d9d9" stroke="#dddddd" stroke-width="1"/><text x="44" y="234" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">owner-one/app-name</text><text x="44" y="253" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#777777" text-anchor="start">main</text><rect x="32" y="264" width="336" height="52" rx="0" fill="#ffffff" stroke="#dddddd" stroke-width="1"/><text x="44" y="286" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">owner-one/service-name</text><text x="44" y="305" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#777777" text-anchor="start">main</text><rect x="298" y="280" width="58" height="20" rx="10" fill="#eeeeee" stroke="#555555" stroke-width="1"/><text x="327" y="294" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#222222" text-anchor="middle">Private</text><rect x="32" y="316" width="336" height="52" rx="0" fill="#ffffff" stroke="#dddddd" stroke-width="1"/><text x="44" y="338" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">owner-one/tool-name</text><text x="44" y="357" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#777777" text-anchor="start">trunk</text><rect x="32" y="368" width="336" height="26" rx="0" fill="#f0f0f0" stroke="#f0f0f0" stroke-width="1"/><text x="44" y="386" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#555555" text-anchor="start">org-two  (2)</text><rect x="32" y="394" width="336" height="52" rx="0" fill="#ffffff" stroke="#dddddd" stroke-width="1"/><text x="44" y="416" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">org-two/api-name</text><text x="44" y="435" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#777777" text-anchor="start">main</text><rect x="298" y="410" width="58" height="20" rx="10" fill="#eeeeee" stroke="#555555" stroke-width="1"/><text x="327" y="424" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#222222" text-anchor="middle">Private</text><rect x="32" y="446" width="336" height="52" rx="0" fill="#ffffff" stroke="#dddddd" stroke-width="1"/><text x="44" y="468" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">org-two/web-name</text><text x="44" y="487" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#777777" text-anchor="start">main</text><rect x="32" y="498" width="336" height="48" rx="0" fill="#ffffff" stroke="#dddddd" stroke-width="1"/><text x="44" y="527" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">+ Connect another account or org</text><text x="356" y="527" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#222222" text-anchor="end">&gt;</text><rect x="28" y="548" width="344" height="212" rx="0" fill="#e6e6e6" stroke="#bbbbbb" stroke-width="1"/><text x="200" y="660" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#777777" text-anchor="middle">On-screen keyboard</text><circle cx="394" cy="152" r="10" fill="#222222"/><text x="394" y="156" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><circle cx="394" cy="199" r="10" fill="#222222"/><text x="394" y="203" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><circle cx="276" cy="238" r="10" fill="#222222"/><text x="276" y="242" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text><circle cx="394" cy="522" r="10" fill="#222222"/><text x="394" y="526" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text><circle cx="394" cy="98" r="10" fill="#222222"/><text x="394" y="102" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
<text x="430" y="68" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">Notes</text>
<circle cx="430" cy="96" r="10" fill="#222222"/><text x="430" y="100" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><text x="450" y="100" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">Focus lands here; the keyboard opens.</text><circle cx="430" cy="136" r="10" fill="#222222"/><text x="430" y="140" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><text x="450" y="140" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">One group per owner login, owners A-Z,</text><text x="450" y="158" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">names A-Z inside. Count in brackets.</text><circle cx="430" cy="194" r="10" fill="#222222"/><text x="430" y="198" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text><text x="450" y="198" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">Active row. Down and Up move it,</text><text x="450" y="216" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">Enter picks it. A tap picks any row.</text><circle cx="430" cy="252" r="10" fill="#222222"/><text x="430" y="256" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text><text x="450" y="256" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">Always the last row. Opens Connections.</text><circle cx="430" cy="292" r="10" fill="#222222"/><text x="430" y="296" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text><text x="450" y="296" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">Close: Esc, the X, or the back gesture.</text><text x="450" y="314" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">Focus returns to the Repository field.</text>
</svg>
