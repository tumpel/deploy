<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
<title>Repository picker: no match</title>
<rect x="0" y="0" width="800" height="800" fill="#ffffff"/>
<text x="20" y="32" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#222222" text-anchor="start">Repository picker: no match</text>
<rect x="20" y="52" width="360" height="720" rx="28" fill="#ffffff" stroke="#555555" stroke-width="2"/><rect x="160" y="62" width="80" height="8" rx="4" fill="#dddddd" stroke="#dddddd" stroke-width="1"/>
<rect x="32" y="76" width="44" height="44" rx="4" fill="#ffffff" stroke="#555555" stroke-width="1"/><line x1="47" y1="91" x2="61" y2="105" stroke="#555555" stroke-width="1.5"/><line x1="61" y1="91" x2="47" y2="105" stroke="#555555" stroke-width="1.5"/><text x="90" y="104" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#222222" text-anchor="start">Repository</text><rect x="36" y="130" width="328" height="44" rx="4" fill="#ffffff" stroke="#555555" stroke-width="2.5"/><circle cx="54" cy="150" r="6" fill="none" stroke="#777777" stroke-width="1.5"/><line x1="58" y1="154" x2="63" y2="159" stroke="#777777" stroke-width="1.5"/><text x="72" y="157" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#222222" text-anchor="start">other-org/thing|</text><text x="44" y="212" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">No repository matches</text><text x="44" y="232" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">&quot;other-org/thing&quot;.</text><text x="44" y="256" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#555555" text-anchor="start">Your GitHub connections cover 5</text><text x="44" y="272" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#555555" text-anchor="start">repositories in 2 accounts.</text><rect x="32" y="290" width="336" height="48" rx="0" fill="#ffffff" stroke="#dddddd" stroke-width="1"/><text x="44" y="319" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">+ Connect another account or org</text><text x="356" y="319" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#222222" text-anchor="end">&gt;</text><rect x="32" y="346" width="336" height="52" rx="0" fill="#ffffff" stroke="#dddddd" stroke-width="1"/><text x="44" y="368" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">Use other-org/thing</text><text x="44" y="387" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#777777" text-anchor="start">Read with the persona's GITHUB_TOKEN</text><rect x="28" y="548" width="344" height="212" rx="0" fill="#e6e6e6" stroke="#bbbbbb" stroke-width="1"/><text x="200" y="660" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#777777" text-anchor="middle">On-screen keyboard</text><circle cx="394" cy="220" r="10" fill="#222222"/><text x="394" y="224" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><circle cx="394" cy="314" r="10" fill="#222222"/><text x="394" y="318" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><circle cx="394" cy="372" r="10" fill="#222222"/><text x="394" y="376" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<text x="430" y="68" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="start">Notes</text>
<circle cx="430" cy="96" r="10" fill="#222222"/><text x="430" y="100" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><text x="450" y="100" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">States the text and what the list holds.</text><circle cx="430" cy="136" r="10" fill="#222222"/><text x="430" y="140" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><text x="450" y="140" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">Active row: Enter opens Connections.</text><text x="450" y="158" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">A Member sees Ask an Owner to connect</text><text x="450" y="176" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">another account or org, to Members.</text><circle cx="430" cy="212" r="10" fill="#222222"/><text x="430" y="216" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text><text x="450" y="216" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">Only where the operation takes any</text><text x="450" y="234" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">repository (prebuild, prompt start) and</text><text x="450" y="252" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222222" text-anchor="start">the text reads as owner/name or a URL.</text>
</svg>
